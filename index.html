<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mystical Creatures Card Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <header class="game-header">
            <h1>Mystical Creatures Card Game</h1>
            <div class="game-stats">
                <div class="stat">
                    <span class="stat-label">Player Cards:</span>
                    <span class="stat-value" id="playerCardCount">5</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Opponent Cards:</span>
                    <span class="stat-value" id="opponentCardCount">5</span>
                </div>
            </div>
        </header>

        <div class="game-board">
            <div class="opponent-area">
                <h2>Opponent's Hand</h2>
                <div class="card-row" id="opponentCards">
                    <!-- Opponent cards will be generated here -->
                </div>
            </div>

            <div class="play-area">
                <h2>Battle Arena</h2>
                <div class="battle-zone">
                    <div class="played-cards" id="playedCards">
                        <!-- Played cards will appear here -->
                    </div>
                </div>
            </div>

            <div class="player-area">
                <h2>Your Hand</h2>
                <div class="card-row" id="playerCards">
                    <!-- Player cards will be generated here -->
                </div>
            </div>
        </div>

        <div class="game-controls">
            <button class="btn btn-primary" id="drawCardBtn">Draw Card</button>
            <button class="btn btn-secondary" id="endTurnBtn">End Turn</button>
            <button class="btn btn-tertiary" id="newGameBtn">New Game</button>
        </div>
    </div>

    <div class="card-detail-modal" id="cardDetailModal">
        <div class="modal-content">
            <span class="close" id="closeModal">&times;</span>
            <div class="card-detail">
                <img id="modalCardImage" src="" alt="Card">
                <div class="card-info">
                    <h3 id="modalCardName"></h3>
                    <p id="modalCardType"></p>
                    <p id="modalCardPower"></p>
                    <p id="modalCardDescription"></p>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
